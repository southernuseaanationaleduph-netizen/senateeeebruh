<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senate of the Philippines — Plenary Simulator (Gemini Free)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #7a6030;
    --navy: #0a1628;
    --navy-mid: #112240;
    --navy-light: #1a3a6b;
    --navy-surface: #0d1f3c;
    --red-ph: #ce1126;
    --blue-ph: #0038a8;
    --cream: #f5efe0;
    --cream-dim: #d4c9a8;
    --text-primary: #f0e8d0;
    --text-secondary: #a89f88;
    --text-dim: #6b6050;
    --majority-color: #c0392b;
    --minority-color: #1a5276;
    --presiding-color: #c9a84c;
    --surface: #0f1e38;
    --surface-raised: #152338;
    --border: rgba(201, 168, 76, 0.2);
    --border-bright: rgba(201, 168, 76, 0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--navy);
    color: var(--text-primary);
    font-family: 'Source Serif 4', Georgia, serif;
    overflow: hidden;
  }

  /* ── LAYOUT ── */
  #app {
    display: grid;
    grid-template-rows: 56px 1fr 200px 72px;
    grid-template-columns: 280px 1fr;
    grid-template-areas:
      "header header"
      "sidebar chamber"
      "sidebar transcript"
      "sidebar input";
    height: 100vh;
    gap: 0;
  }

  /* ── HEADER ── */
  #header {
    grid-area: header;
    background: var(--navy-mid);
    border-bottom: 1px solid var(--border-bright);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: relative;
    z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .ph-seal {
    width: 36px; height: 36px;
    background: radial-gradient(circle, var(--gold-light), var(--gold));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 12px rgba(201,168,76,0.4);
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--gold-light);
    letter-spacing: 0.05em;
  }
  .header-sub {
    font-size: 10px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 6px #2ecc71;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  #api-key-area {
    display: flex; align-items: center; gap: 8px;
  }
  #api-key-input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    width: 200px;
    outline: none;
  }
  #api-key-input:focus { border-color: var(--gold); }
  #api-key-input::placeholder { color: var(--text-dim); }
  #save-key-btn {
    background: var(--gold-dim);
    border: none;
    color: var(--cream);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
  }
  #save-key-btn:hover { background: var(--gold); color: var(--navy); }

  /* ── SIDEBAR ── */
  #sidebar {
    grid-area: sidebar;
    background: var(--navy-surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .sidebar-section {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .vote-tally {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .vote-bar {
    height: 6px; border-radius: 3px;
    background: var(--surface);
    overflow: hidden;
  }
  .vote-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--majority-color), var(--gold));
    transition: width 0.5s ease;
  }

  .senator-list { display: flex; flex-direction: column; gap: 3px; }
  .senator-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: default;
    transition: background 0.15s;
    font-size: 11px;
  }
  .senator-item:hover { background: rgba(201,168,76,0.07); }
  .senator-item.speaking { background: rgba(201,168,76,0.15); }
  .senator-item.you { background: rgba(26,90,107,0.2); }
  .senator-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
    flex-shrink: 0;
  }
  .senator-avatar.maj { background: rgba(192,57,43,0.3); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
  .senator-avatar.min { background: rgba(26,82,118,0.4); color: #5dade2; border: 1px solid rgba(93,173,226,0.3); }
  .senator-avatar.you { background: rgba(201,168,76,0.2); color: var(--gold); border: 1px solid var(--gold-dim); }
  .senator-name { color: var(--text-secondary); line-height: 1.2; }
  .senator-name strong { color: var(--text-primary); font-weight: 400; display: block; font-size: 11px; }
  .senator-name span { font-size: 10px; color: var(--text-dim); }
  .senator-mic {
    margin-left: auto;
    font-size: 10px;
    color: var(--gold);
    display: none;
  }
  .senator-item.speaking .senator-mic { display: block; }

  /* ── CHAMBER (seat map) ── */
  #chamber {
    grid-area: chamber;
    background: var(--navy-mid);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  #chamber-svg {
    width: 100%; height: 100%;
  }
  .chamber-bg {
    fill: var(--navy-mid);
  }
  .floor-arc {
    fill: none;
    stroke: rgba(201,168,76,0.12);
    stroke-width: 1;
  }
  .presiding-dais {
    fill: rgba(201,168,76,0.08);
    stroke: var(--gold-dim);
    stroke-width: 1;
  }
  .seat-circle {
    cursor: default;
    transition: all 0.3s ease;
  }
  .seat-circle.maj { fill: rgba(192,57,43,0.5); stroke: rgba(231,76,60,0.6); stroke-width: 1.5; }
  .seat-circle.min { fill: rgba(26,82,118,0.5); stroke: rgba(93,173,226,0.4); stroke-width: 1.5; }
  .seat-circle.you { fill: rgba(201,168,76,0.3); stroke: var(--gold); stroke-width: 2; }
  .seat-circle.presiding { fill: rgba(201,168,76,0.25); stroke: var(--gold-light); stroke-width: 2; }
  .seat-circle.speaking {
    filter: drop-shadow(0 0 8px var(--gold-light));
    stroke-width: 3;
  }
  .seat-circle.speaking.maj { fill: rgba(231,76,60,0.8); stroke: #e74c3c; filter: drop-shadow(0 0 10px #e74c3c); }
  .seat-circle.speaking.min { fill: rgba(93,173,226,0.8); stroke: #5dade2; filter: drop-shadow(0 0 10px #5dade2); }
  .seat-circle.speaking.you { fill: rgba(201,168,76,0.8); stroke: var(--gold-light); filter: drop-shadow(0 0 10px var(--gold-light)); }
  .seat-circle.speaking.presiding { fill: rgba(201,168,76,0.9); stroke: var(--gold-light); filter: drop-shadow(0 0 12px var(--gold-light)); }
  .seat-label { font-size: 5px; fill: rgba(240,232,208,0.7); text-anchor: middle; pointer-events: none; font-family: 'JetBrains Mono', monospace; }
  .chamber-label {
    font-family: 'Playfair Display', serif;
    fill: rgba(201,168,76,0.15);
    font-size: 11px;
    text-anchor: middle;
  }
  .speaking-name-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    fill: var(--gold-light);
    text-anchor: middle;
  }
  .aisle-line { stroke: rgba(201,168,76,0.08); stroke-width: 0.5; }

  #now-speaking-banner {
    position: absolute;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(10,22,40,0.9);
    border: 1px solid var(--border-bright);
    border-radius: 4px;
    padding: 5px 16px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold-light);
    white-space: nowrap;
    display: none;
    letter-spacing: 0.05em;
  }

  /* ── TRANSCRIPT ── */
  #transcript-area {
    grid-area: transcript;
    background: var(--surface);
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 0;
    border-top: 1px solid var(--border);
  }
  .record {
    padding: 10px 20px;
    border-bottom: 1px solid rgba(201,168,76,0.06);
    display: flex; gap: 12px;
    font-size: 13px;
    line-height: 1.65;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .record-bar {
    width: 3px; border-radius: 2px; flex-shrink: 0; margin-top: 2px;
    align-self: stretch; min-height: 16px;
  }
  .record-bar.presiding { background: var(--gold); }
  .record-bar.majority { background: var(--majority-color); }
  .record-bar.minority { background: var(--minority-color); }
  .record-bar.user { background: var(--gold-light); }
  .record-bar.plenary { background: #2ecc71; }
  .record-content { flex: 1; }
  .record-speaker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .record-speaker.presiding { color: var(--gold); }
  .record-speaker.majority { color: #e74c3c; }
  .record-speaker.minority { color: #5dade2; }
  .record-speaker.user { color: var(--gold-light); }
  .record-speaker.plenary { color: #2ecc71; }
  .record-text { color: var(--text-primary); }
  .record-text.plenary { color: #a8e6b8; font-style: italic; }

  #typing-row {
    padding: 8px 20px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    display: none;
    align-items: center; gap: 8px;
  }
  #typing-row.active { display: flex; }
  .typing-dots span {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--gold-dim);
    margin: 0 2px;
    animation: dot-bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

  /* ── INPUT ── */
  #input-area {
    grid-area: input;
    background: var(--navy-mid);
    border-top: 1px solid var(--border-bright);
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
  }
  #senator-you-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--gold);
    white-space: nowrap;
    letter-spacing: 0.06em;
  }
  #speech-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    padding: 8px 14px;
    outline: none;
    resize: none;
    height: 50px;
    line-height: 1.5;
  }
  #speech-input:focus { border-color: var(--gold-dim); }
  #speech-input::placeholder { color: var(--text-dim); font-style: italic; }

  .input-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    white-space: nowrap;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
    height: 50px;
  }
  .input-btn:hover { border-color: var(--gold-dim); color: var(--gold-light); }
  #mic-btn { font-size: 18px; padding: 8px 12px; }
  #mic-btn.recording { border-color: var(--red-ph); color: var(--red-ph); animation: pulse 1s infinite; }
  #speak-btn {
    background: var(--gold-dim);
    border-color: var(--gold-dim);
    color: var(--cream);
    font-weight: 500;
  }
  #speak-btn:hover { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  #speak-btn:disabled { background: var(--surface); border-color: var(--border); color: var(--text-dim); cursor: not-allowed; }

  /* ── QUICK ACTIONS ── */
  #quick-actions {
    position: absolute;
    bottom: 82px; left: 290px; right: 0;
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 6px 20px;
    background: rgba(10,22,40,0.85);
    border-top: 1px solid var(--border);
    z-index: 5;
  }
  .qa-btn {
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .qa-btn:hover { border-color: var(--gold-dim); color: var(--gold-light); background: rgba(201,168,76,0.08); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Vote modal */
  #vote-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center; justify-content: center;
  }
  #vote-modal.active { display: flex; }
  .vote-modal-box {
    background: var(--navy-mid);
    border: 1px solid var(--border-bright);
    border-radius: 8px;
    padding: 28px 32px;
    width: 480px;
    max-width: 90vw;
  }
  .vote-modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--gold-light);
    margin-bottom: 6px;
  }
  .vote-modal-sub {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 20px;
  }
  .vote-list { display: flex; flex-direction: column; gap: 3px; max-height: 260px; overflow-y: auto; margin-bottom: 16px; }
  .vote-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 8px; font-size: 11px;
    border-radius: 3px;
  }
  .vote-item .v-name { color: var(--text-secondary); }
  .vote-item .v-vote { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
  .vote-item .v-vote.aye { color: #2ecc71; }
  .vote-item .v-vote.nay { color: #e74c3c; }
  .vote-item .v-vote.abstain { color: var(--text-dim); }
  .vote-result {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    text-align: center;
    padding: 12px;
    border-radius: 4px;
    background: rgba(201,168,76,0.08);
    border: 1px solid var(--border);
    color: var(--gold-light);
    margin-bottom: 16px;
  }
  .close-vote-btn {
    width: 100%;
    background: var(--gold-dim);
    border: none;
    color: var(--cream);
    padding: 10px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  .close-vote-btn:hover { background: var(--gold); color: var(--navy); }

  #tts-toggle {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
  }
  #tts-toggle input { accent-color: var(--gold); }
</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div class="header-left">
      <div class="ph-seal">🏛</div>
      <div>
        <div class="header-title">SENATE OF THE PHILIPPINES — PLENARY SIMULATOR</div>
        <div class="header-sub">19TH CONGRESS · REGULAR SESSION · PICC, PASAY CITY</div>
      </div>
    </div>
    <div class="header-right">
      <label id="tts-toggle">
        <input type="checkbox" id="tts-enabled" checked> VOICES ON
      </label>
      <div id="api-key-area">
        <input type="password" id="api-key-input" placeholder="Paste Gemini API key…">
        <button id="save-key-btn" onclick="saveKey()">CONNECT</button>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        <span id="session-status">SESSION OPEN</span>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Floor Balance</div>
      <div class="vote-tally">
        <span style="color:#e74c3c">MAJORITY <strong>13</strong></span>
        <span style="color:#5dade2">MINORITY <strong>11</strong></span>
      </div>
      <div class="vote-bar"><div class="vote-bar-fill" id="maj-bar" style="width:52%"></div></div>
    </div>
    <div class="sidebar-section" style="flex:1; overflow-y:auto">
      <div class="sidebar-label">Senators</div>
      <div class="senator-list" id="senator-list"></div>
    </div>
  </div>

  <!-- CHAMBER SVG -->
  <div id="chamber">
    <svg id="chamber-svg" viewBox="0 0 700 260" preserveAspectRatio="xMidYMid meet">
      <rect class="chamber-bg" width="700" height="260"/>
      <!-- Decorative arcs -->
      <ellipse cx="350" cy="280" rx="320" ry="240" class="floor-arc"/>
      <ellipse cx="350" cy="280" rx="260" ry="195" class="floor-arc"/>
      <ellipse cx="350" cy="280" rx="200" ry="150" class="floor-arc"/>
      <!-- Aisle -->
      <line x1="350" y1="30" x2="350" y2="240" class="aisle-line"/>
      <!-- Presiding dais -->
      <rect x="275" y="8" width="150" height="36" rx="4" class="presiding-dais"/>
      <text x="350" y="30" class="chamber-label" style="fill:rgba(201,168,76,0.5);font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:0.1em">PRESIDING OFFICER</text>
      <!-- Seat elements generated by JS -->
      <g id="seats-g"></g>
      <!-- Chamber label -->
      <text x="350" y="252" class="chamber-label">THE SENATE FLOOR</text>
    </svg>
    <div id="now-speaking-banner" id="speaking-banner">● &nbsp;<span id="speaking-name-text"></span></div>
  </div>

  <!-- TRANSCRIPT -->
  <div id="transcript-area">
    <div id="typing-row">
      <div class="typing-dots"><span></span><span></span><span></span></div>
      <span id="typing-label">Senate floor active…</span>
    </div>
  </div>

  <!-- QUICK ACTIONS -->
  <div id="quick-actions">
    <button class="qa-btn" onclick="qa('Mr. President, I rise to make a motion.')">📋 Make a motion</button>
    <button class="qa-btn" onclick="qa('Mr. President, I rise to interpellate the sponsor of the measure.')">❓ Interpellate</button>
    <button class="qa-btn" onclick="qa('Mr. President, I move that we suspend the rules and proceed to the next item on the agenda.')">⚡ Suspend rules</button>
    <button class="qa-btn" onclick="qa('Mr. President, point of order.')">⚠️ Point of order</button>
    <button class="qa-btn" onclick="qa('Mr. President, I move to challenge the current Senate leadership. I move for a change in the Senate Presidency.')">⚔️ Challenge leadership</button>
    <button class="qa-btn" onclick="qa('Mr. President, I move for a roll-call vote on this matter.')">🗳️ Call roll-call vote</button>
    <button class="qa-btn" onclick="qa('Mr. President, I rise on a privilege speech.')">🎤 Privilege speech</button>
    <button class="qa-btn" onclick="qa('Mr. President, I object!')">🚫 Object!</button>
  </div>

  <!-- INPUT -->
  <div id="input-area">
    <div id="senator-you-tag">SEN. NO.25 / YOU</div>
    <textarea id="speech-input" placeholder="Mr. President, I rise to…  (Enter to speak, Shift+Enter for newline)"></textarea>
    <button id="mic-btn" class="input-btn" onclick="toggleMic()" title="Voice input">🎙</button>
    <button id="speak-btn" class="input-btn" onclick="sendSpeech()">SPEAK →</button>
  </div>

</div>

<!-- VOTE MODAL -->
<div id="vote-modal">
  <div class="vote-modal-box">
    <div class="vote-modal-title" id="vote-modal-title">Roll-Call Vote</div>
    <div class="vote-modal-sub" id="vote-modal-sub"></div>
    <div class="vote-list" id="vote-list"></div>
    <div class="vote-result" id="vote-result"></div>
    <button class="close-vote-btn" onclick="closeVote()">CLOSE — ENTER INTO THE RECORD</button>
  </div>
</div>

<script>

// SEAT POSITIONS on SVG (700x260 viewBox, presiding at top center)
// Three arced rows of senators
function generateSeatPositions() {
  const positions = [];
  // Presiding officer - center top
  positions.push({ x: 350, y: 30, id: 0 });

  // Row 1 (innermost arc) - 8 seats
  const r1 = { cx: 350, cy: 290, rx: 180, ry: 130 };
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * (0.15 + (i / 7) * 0.70);
    positions.push({
      x: r1.cx - r1.rx * Math.cos(angle),
      y: r1.cy - r1.ry * Math.sin(angle),
      id: i + 1
    });
  }

  // Row 2 (middle arc) - 8 seats
  const r2 = { cx: 350, cy: 300, rx: 245, ry: 180 };
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * (0.12 + (i / 7) * 0.76);
    positions.push({
      x: r2.cx - r2.rx * Math.cos(angle),
      y: r2.cy - r2.ry * Math.sin(angle),
      id: i + 9
    });
  }

  // Row 3 (outer arc) - 8 seats
  const r3 = { cx: 350, cy: 310, rx: 305, ry: 225 };
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI * (0.10 + (i / 7) * 0.80);
    positions.push({
      x: r3.cx - r3.rx * Math.cos(angle),
      y: r3.cy - r3.ry * Math.sin(angle),
      id: i + 17
    });
  }

  return positions;
}

function buildSeatMap() {
  const g = document.getElementById('seats-g');
  const positions = generateSeatPositions();

  positions.forEach((pos, idx) => {
    const sen = SENATORS[idx];
    const alignClass = sen.align === 'presiding' ? 'presiding' : sen.align === 'you' ? 'you' : sen.align === 'majority' ? 'maj' : 'min';

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', pos.x.toFixed(1));
    circle.setAttribute('cy', pos.y.toFixed(1));
    circle.setAttribute('r', idx === 0 ? 13 : 10);
    circle.setAttribute('class', `seat-circle ${alignClass}`);
    circle.setAttribute('id', `seat-${idx}`);
    circle.setAttribute('data-id', idx);
    g.appendChild(circle);

    const label = document.createElementNS('http://www.w3.org/2000/svg','text');

    label.setAttribute('class', 'seat-label');
    label.textContent = sen.short.length > 6 ? sen.short.substring(0,6) : sen.short;
    g.appendChild(label);

    const oldItem = document.getElementById(`sitem-${currentSpeakSeatId}`);
    if (oldItem) oldItem.classList.remove('speaking');
  }
  currentSpeakSeatId = id;
  if (id >= 0) {
    const el = document.getElementById(`seat-${id}`);
    if (el) el.classList.add('speaking');
    const item = document.getElementById(`sitem-${id}`);

// ── TTS ──
let availableVoices = [];
function loadVoices() {
  availableVoices = speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function getVoice(profile) {
  if (availableVoices.length === 0) availableVoices = speechSynthesis.getVoices();
  for (const pref of (profile.voice_pref || [])) {
    const found = availableVoices.find(v => v.name.includes(pref) || v.lang.startsWith(pref));
    if (found) return found;
  }
  return availableVoices.find(v => v.lang.startsWith('en')) || availableVoices[0] || null;
}

function speakText(text, senatorId, onDone) {
  if (!ttsEnabled) { if(onDone) onDone(); return; }
  speechSynthesis.cancel();
  const clean = text.replace(/\[.*?\]/g, '').replace(/\*/g,'').trim().substring(0, 400);
  if (!clean) { if(onDone) onDone(); return; }
  const utt = new SpeechSynthesisUtterance(clean);
  const profile = VOICE_PROFILES[senatorId] || VOICE_PROFILES[0];
  utt.pitch = profile.pitch;
  utt.rate = profile.rate;
  utt.volume = 0.95;
  const voice = getVoice(profile);
  if (voice) utt.voice = voice;
  utt.onend = () => { if(onDone) onDone(); };
  utt.onerror = () => { if(onDone) onDone(); };
  setSpeakingSeat(senatorId);
  speechSynthesis.speak(utt);
}

function addRecord(senatorId, speech, isPlenary) {
  const ta = document.getElementById('transcript-area');
  const typingRow = document.getElementById('typing-row');
  const div = document.createElement('div');
  div.className = 'record';
  const sen = senatorId >= 0 ? SENATORS[senatorId] : null;

  let barClass = 'presiding', speakerClass = 'presiding', speakerLabel = '';
  if (isPlenary) {
    barClass = speakerClass = 'plenary';
    speakerLabel = '⚖ PLENARY ACTION / PARLIAMENTARY RECORD';
  } else if (sen) {
    if (sen.align === 'you') { barClass = speakerClass = 'user'; }
    else if (sen.align === 'presiding') { barClass = speakerClass = 'presiding'; }
    else if (sen.align === 'majority') { barClass = speakerClass = 'majority'; }
    else { barClass = speakerClass = 'minority'; }
    speakerLabel = `${sen.name.toUpperCase()} · ${sen.role} · ${sen.party}`;
  }

  div.innerHTML = `
    <div class="record-bar ${barClass}"></div>
    <div class="record-content">
      <div class="record-speaker ${speakerClass}">${speakerLabel}</div>
      <div class="record-text ${isPlenary?'plenary':''}">${speech}</div>
    </div>
  `;
  ta.insertBefore(div, typingRow);
  ta.scrollTop = ta.scrollHeight;
}

// ── PARSE AI RESPONSE ──
function parseAndRenderResponse(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const speechSegments = [];

  lines.forEach(line => {
    const trimmed = line.trim();

    // [PLENARY ACTION]
    if (/^\[PLENARY ACTION\]/i.test(trimmed)) {
      const speech = trimmed.replace(/^\[PLENARY ACTION\]\s*:?\s*/i, '');
      addRecord(-1, speech, true);
      // Check for vote trigger
      if (/roll.call vote/i.test(speech) || /recorded vote/i.test(speech)) {
        setTimeout(() => triggerRollCallFromText(speech), 500);
      }
      return;
    }

    // [PRESIDING OFFICER...]
    if (/^\[PRESIDING OFFICER/i.test(trimmed)) {
      const speech = trimmed.replace(/^\[PRESIDING OFFICER[^\]]*\]\s*:?\s*/i, '');
      if (speech) {
        addRecord(0, speech, false);
        speechSegments.push({ id: 0, text: speech });
      }
      return;
    }

    // [SENATOR — Name / Role]
    const senMatch = trimmed.match(/^\[SENATOR\s*[—–-]\s*([^\]\/]+?)(?:\/[^\]]*)?\]\s*:?\s*(.*)/i);
    if (senMatch) {
      const namePart = senMatch[1].trim();
      const speech = senMatch[2].trim();
      if (speech) {
        const senIdx = findSenator(namePart);
        addRecord(senIdx, speech, false);
        speechSegments.push({ id: senIdx, text: speech });
      }
      return;
    }

    // Fallback - plain line with content
    if (trimmed && !trimmed.startsWith('[') && trimmed.length > 10) {
      addRecord(0, trimmed, false);
    }
  });

  // Queue TTS
  if (ttsEnabled && speechSegments.length > 0) {
    queueSpeech(speechSegments);
  } else {
    setSpeakingSeat(-1);
  }
}

function findSenator(namePart) {
  const n = namePart.toLowerCase();
  for (let i = 0; i < SENATORS.length; i++) {
    if (SENATORS[i].name.toLowerCase().includes(n) ||
        SENATORS[i].short.toLowerCase().includes(n) ||
        n.includes(SENATORS[i].short.toLowerCase())) {
      return i;
    }
  }
  return 1; // default to majority leader if not found
}

function queueSpeech(segments) {
  speechQueue = [...segments];
  if (!isSpeaking) processQueue();
}

function processQueue() {
  if (speechQueue.length === 0) {
    isSpeaking = false;
    setSpeakingSeat(-1);
    return;
  }
  isSpeaking = true;
  const { id, text } = speechQueue.shift();
  speakText(text, id, () => {
    setTimeout(processQueue, 300);
  });
}

// ── ROLL CALL VOTE ──
function triggerRollCallFromText(context) {
  const votes = [];
  const isMajorityFavor = !/(oppose|nay|against majority)/i.test(context);
  SENATORS.slice(0, 24).forEach((s, i) => {
    let vote;
    if (s.align === 'majority') {
      vote = Math.random() < 0.92 ? 'AYE' : 'NAY';
    } else if (s.align === 'minority') {
      vote = Math.random() < 0.88 ? 'NAY' : 'AYE';
    } else if (s.align === 'presiding') {
      vote = 'ABSTAIN';
    } else {
      vote = Math.random() < 0.5 ? 'AYE' : 'NAY';
    }
    votes.push({ name: s.name, vote, align: s.align });
  });
  // User vote
  votes.push({ name: 'Sen. No. 25 (YOU)', vote: '— (YOUR VOTE)', align: 'you' });

  const ayes = votes.filter(v => v.vote === 'AYE').length;
  const nays = votes.filter(v => v.vote === 'NAY').length;

  showVoteModal('Roll-Call Vote', context.substring(0, 80), votes, ayes, nays);
}

function showVoteModal(title, sub, votes, ayes, nays) {
  document.getElementById('vote-modal-title').textContent = title;
  document.getElementById('vote-modal-sub').textContent = sub;
  const list = document.getElementById('vote-list');
  list.innerHTML = '';
  votes.forEach(v => {
    const row = document.createElement('div');
    row.className = 'vote-item';
    const vClass = v.vote === 'AYE' ? 'aye' : v.vote === 'NAY' ? 'nay' : 'abstain';
    row.innerHTML = `<span class="v-name">${v.name}</span><span class="v-vote ${vClass}">${v.vote}</span>`;
    list.appendChild(row);
  });
  const passed = ayes > nays;
  document.getElementById('vote-result').textContent = `${ayes} AYES · ${nays} NAYS → MOTION ${passed ? 'CARRIED' : 'FAILS'}`;
  document.getElementById('vote-modal').classList.add('active');
}

function closeVote() {
  document.getElementById('vote-modal').classList.remove('active');
}

const SYSTEM_PROMPT = `You are simulating a LIVE plenary session of the Senate of the Philippines. The simulation has 25 senators. Senator No. 25 is the USER — you voice all others.

SENATORS (voice all of these):
${SENATORS.slice(0,24).map((s,i) => `${i+1}. ${s.name} (${s.role}, ${s.party}, ${s.align.toUpperCase()}) — Personality: ${s.style}`).join('\n')}

CRITICAL SIMULATION RULES:
1. Follow actual Philippine Senate parliamentary procedure (motions, points of order, interpellation, suspension of rules, viva voce/roll-call voting, quorum calls, privilege speeches).
2. NO senator may speak unless RECOGNIZED by the Presiding Officer OR making a proper procedural motion.
3. Leadership changes require: motion → seconder → debate → majority vote (13 of 24 non-presiding senators).
4. MAJORITY (Senators 2,4,5,6,7,8,9,10,11,17,18,19,22,24 — 13 senators) and MINORITY (Senators 3,12,13,14,15,16,20,21,23 — 11 senators) MUST genuinely disagree on contentious matters.
5. Senators have UNIQUE voices — Macapagal is loud and populist, Evangelista quotes the Constitution, Abad is aggressive, Lacson is terse, Hernandez is long-winded, Cayetano is combative, etc.
6. The Presiding Officer (Senate President Aquino) speaks formally and neutrally — NEVER takes sides.
7. INTERRUPTIONS, POINTS OF ORDER, and PARLIAMENTARY CLASHES are ENCOURAGED when realistic.
8. When USER makes a motion — the Presiding Officer rules on its form, then the body debates/votes.
9. NEVER break character. NEVER say you are an AI. NEVER summarize outside the Senate record.
10. Generate HEATED, AUTHENTIC, POLITICALLY CHARGED responses. At least 3-5 senators should react to each USER statement.
11. Include Filipino political flavor: "Mr. President", "the distinguished gentleman/lady from...", parliamentary Latin, etc.
12. If a roll-call vote is requested, include [PLENARY ACTION]: Roll-call vote conducted. in your response.

OUTPUT FORMAT (STRICT — follow exactly):
[PRESIDING OFFICER]: (statement)
[SENATOR — Name / Role]: (statement)
[SENATOR — Name / Role]: (statement)
[PLENARY ACTION]: (vote counts, rulings, suspensions, referrals)

Generate realistic, multi-senator responses. Make the plenary feel ALIVE.`;

async function callAPI(userMessage) {
  if (!apiKey) {
    addRecord(-1, '⚠ Walang API key. I-paste ang Gemini API key sa taas (libre sa aistudio.google.com) tapos click CONNECT.', true);
    return;
  }

  conversationHistory.push({ role: 'user', content: `[SENATOR NO. 25 / USER — Independent]: ${userMessage}` });

  document.getElementById('typing-row').classList.add('active');
  document.getElementById('speak-btn').disabled = true;
  document.getElementById('session-status').textContent = 'FLOOR ACTIVE';

  try {
    const geminiMessages = conversationHistory.map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: geminiMessages,
          generationConfig: { maxOutputTokens: 1200, temperature: 0.9 }
        })
      }
    );

    const data = await response.json();

    if (data.error) {
      addRecord(-1, `⚠ API Error: ${data.error.message}`, true);
      conversationHistory.pop();
      return;
    }

    const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
    conversationHistory.push({ role: 'assistant', content: reply });
    parseAndRenderResponse(reply);

  } catch (err) {
    addRecord(-1, `⚠ Connection error: ${err.message}`, true);
    conversationHistory.pop();
  } finally {
    document.getElementById('typing-row').classList.remove('active');
    document.getElementById('speak-btn').disabled = false;
    document.getElementById('session-status').textContent = 'SESSION OPEN';
  }
}

// ── USER SPEECH ──
function sendSpeech() {
  if (isLoading) return;
  const input = document.getElementById('speech-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addRecord(24, text, false);
  setSpeakingSeat(24);
  setTimeout(() => callAPI(text), 400);
}

function qa(text) {
  document.getElementById('speech-input').value = text;
  sendSpeech();
}

// ── MIC / SPEECH RECOGNITION ──
function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Speech recognition is not supported in this browser. Please use Google Chrome.');
    return;
  }
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-PH';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    document.getElementById('speech-input').value = transcript;
    if (e.results[e.results.length-1].isFinal) {
      stopRecording();
      setTimeout(sendSpeech, 300);
    }
  };

  recognition.onerror = () => stopRecording();
  recognition.onend = () => stopRecording();

  recognition.start();
  isRecording = true;
  document.getElementById('mic-btn').classList.add('recording');
  document.getElementById('mic-btn').textContent = '🔴';
}

function stopRecording() {
  if (recognition) { recognition.stop(); recognition = null; }
  isRecording = false;
  document.getElementById('mic-btn').classList.remove('recording');
  document.getElementById('mic-btn').textContent = '🎙';
}
